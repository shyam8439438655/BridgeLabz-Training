# ===== Server =====
server.port=8080

# ===== H2 Database (in-memory, resets on restart) =====
spring.datasource.url=jdbc:h2:mem:payrolldb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console -> available at http://localhost:8080/h2-console
# JDBC URL to use in the console: jdbc:h2:mem:payrolldb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ===== App name =====
spring.application.name=payroll-app
