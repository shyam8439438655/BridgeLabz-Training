services:
  # ── Redis Container (UC9) ──
  redis:
    image: redis:alpine
    container_name: fundoo-redis
    ports:
      - "6379:6379"
    restart: always

  # ── RabbitMQ Container with Management Console (UC10) ──
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fundoo-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: always

  # ── ActiveMQ Classic Container (UC8 - optional real broker) ──
  activemq:
    image: rmohr/activemq:latest
    container_name: fundoo-activemq
    ports:
      - "61616:61616"  # JMS wire protocol port
      - "8161:8161"    # Web Console port
    restart: always
